name: Green CI Metrics

on:
  push:
    branches:
      - main

jobs:
  green-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libncurses-dev

      - name: Record build start time
        id: start
        run: echo "time=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Build LAN-Chat
        run: |
          g++ server.cpp -o server -pthread -std=c++11
          g++ client.cpp -o client -pthread -std=c++11
          g++ client_ui.cpp -o client_ui -lncurses -pthread -std=c++11

      - name: Verify build outputs
        run: |
          test -x server
          test -x client
          test -x client_ui

      - name: Record build end time
        id: end
        run: echo "time=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Calculate build duration
        id: duration
        run: |
          start=${{ steps.start.outputs.time }}
          end=${{ steps.end.outputs.time }}
          echo "duration=$((end - start))" >> "$GITHUB_OUTPUT"

      - name: Send data to Green Dev Backend
        env:
          GREEN_METRICS_URL: ${{ secrets.GREEN_METRICS_URL }}
          GREEN_METRICS_TOKEN: ${{ secrets.GREEN_METRICS_TOKEN }}
        run: |
          curl --fail --show-error --silent -X POST "$GREEN_METRICS_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GREEN_METRICS_TOKEN" \
            -d '{
              "repo": "${{ github.repository }}",
              "branch": "${{ github.ref_name }}",
              "commit": "${{ github.sha }}",
              "duration": ${{ steps.duration.outputs.duration }},
              "runner_type": "${{ runner.os }}"
            }'